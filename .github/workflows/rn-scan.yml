name: rn-scan

# Three scans a day, Pacific. Cron in Actions is UTC, so these are
# 07:00 / 13:00 / 19:00 PST and shift an hour under PDT — fine for a
# window that stays open for days.
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:        # lets you trigger a run by hand

permissions:
  contents: write           # needed to commit state/seen.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every case in here is a bug that already shipped once and cost real
      # postings. Cheap to run, and a rule change that reintroduces one
      # should stop the scan rather than quietly narrow it.
      - name: Rule regression tests
        run: python3 test_rules.py

      - name: Run scan
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python3 run_scan.py

      - name: Publish digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: |
            board.html
            digest.html
            applications.csv
          retention-days: 30

      # seen.json is what makes "new since last scan" mean anything.
      # Without committing it back, every run reports everything as new.
      - name: Commit state
        run: |
          git config user.name  "rn-scan"
          git config user.email "rn-scan@users.noreply.github.com"
          git add state/seen.json applications.csv board.html digest.html DIGEST.md
          git diff --staged --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%M)"
          git push

# The scan used to open a GitHub issue and assign it to the repo owner,
# because GitHub emails you on assignment and that needed no SMTP secret.
# It was removed, and the reason is worth keeping: an alert can only carry
# what is NEW, or it repeats itself three times a day until it stops being
# read. So it sent one or two postings at a time, and a job not acted on
# the morning it appeared was never put in front of anyone again.
#
# board.html replaces it. It is the standing list — every open posting,
# scan after scan, until it is marked — and it is read in Claude, where the
# marking happens. Nothing here pushes it: the scan writes the file, and
# publishing it is one step on the Claude side. See README, "The board".

# Runtime is roughly 8-10 minutes, dominated by the 1-second politeness
# delay between requests. That is ~30 minutes a DAY across three runs, so
# roughly 700-900 minutes a month — a third to a half of the 2,000 free
# minutes a private repo gets. (An earlier version of this comment said
# "~30 minutes a month", which was the daily figure mislabelled.) Comfortable,
# but not free-and-unlimited: adding sources or dropping REQUEST_DELAY_SEC
# moves this number, and a public repo would make it moot since Actions
# minutes are only metered on private ones.
#
# GitHub disables scheduled workflows in a repo with no activity for 60
# days and emails the owner. Don't assume this scan's own commits reset
# that clock; if the digest ever goes stale, check the Actions tab first.
# Scheduled runs are also queued rather than punctual — a few minutes late
# is normal, and under load GitHub can skip one entirely.
#
# To serve digest.html as a web page, enable GitHub Pages on this repo and
# point it at the branch root. Otherwise download it from the artifact,
# or open it locally.
